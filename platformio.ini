; SmartKey is header-only: -Isrc is all the build needs.
; Unit tests run on the PC:   pio test -e native
; Examples are built by pointing src_dir at one of them, e.g.
;   pio run -e esp32dev   (src_dir below = examples/Basic/SimpleClick)

[platformio]
default_envs = native
src_dir = examples/Basic/SimpleClick

[env]
build_flags =
    -Isrc
    -Wall
    -Wextra

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=gnu++11
test_framework = unity
test_build_src = no

[env:uno]
platform = atmelavr
board = uno
framework = arduino
test_framework = unity

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
test_framework = unity

[env:stm32]
platform = ststm32
board = bluepill_f103c8
framework = arduino
test_framework = unity

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
test_framework = unity

[env:rp2040]
platform = raspberrypi
board = pico
framework = arduino
test_framework = unity
